# Full-scale run — test split, D→L only, 100 citation-rich cases
# Selected via scripts/scan_citation_rich_cases.py --split test --min-citations 1
# (338/908 test cases have >=1 gold citation; this is the top 100 by density,
# 3-36 gold citations/case, 631 gold citations total).
#
# Why test (not validation): PRIMERA is a frozen pretrained checkpoint here —
# no hyperparameter tuning happens on this data — so there is no leakage risk
# in reporting final numbers on the held-out test split. Existing n=10/n=50
# pilots used validation; this run is the one whose numbers go in the thesis.
#
# Why citation-rich, not all 908: CourtListener's cap is 1 call per summary
# regardless of citation count (up to 250/call), so denser cases are strictly
# more budget-efficient for the paired-HR metric this thesis reports on.
# ROUGE/BERTScore quality metrics are computed on this same subset for
# consistency between the quality and faithfulness numbers reported together.

